<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tdTitle tdDesc">
  <title id="tdTitle">Local trust from a distance</title>
  <desc id="tdDesc">Line-art illustration of an owner's phone connecting across distance to a local team standing beside a duplex property in New Braunfels.</desc>

  <g fill="none" stroke="#14304A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left: owner's phone -->
    <rect x="70" y="90" width="90" height="160"/>
    <line x1="70" y1="114" x2="160" y2="114"/>
    <line x1="70" y1="226" x2="160" y2="226"/>
    <circle cx="115" cy="238" r="6"/>
    <path d="M92 150 Q115 130 138 150"/>
    <path d="M100 168 Q115 156 130 168"/>
    <circle cx="115" cy="186" r="4" fill="#14304A" stroke="none"/>
    <text x="115" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" letter-spacing="1.5" fill="#14304A" stroke="none">OWNER</text>

    <!-- duplex -->
    <g transform="translate(630,60)">
      <rect x="0" y="70" width="150" height="100"/>
      <line x1="75" y1="70" x2="75" y2="170"/>
      <path d="M-10 70 L75 20 L160 70"/>
      <rect x="18" y="110" width="26" height="26"/>
      <rect x="106" y="110" width="26" height="26"/>
      <rect x="60" y="130" width="30" height="40"/>

      <!-- person: local team -->
      <g transform="translate(175,90)">
        <circle cx="20" cy="18" r="14"/>
        <path d="M0 78 C0 48 8 40 20 40 C32 40 40 48 40 78"/>
      </g>
      <text x="95" y="205" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" letter-spacing="1" fill="#14304A" stroke="none">LOCAL TEAM &#183; NEW BRAUNFELS</text>
    </g>
  </g>

  <!-- Dashed distance line -->
  <line x1="185" y1="170" x2="620" y2="170" stroke="#14304A" stroke-width="1.75" stroke-dasharray="8 8"/>
  <text x="400" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" letter-spacing="2" fill="#14304A" font-weight="700">ANY DISTANCE</text>
</svg>
