<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hsTitle hsDesc">
  <title id="hsTitle">Architectural line sketch of a small multifamily property</title>
  <desc id="hsDesc">A minimal single-line architectural elevation drawing of a duplex-style residential building with a pitched roof, symmetrical windows, and a shared entry walk.</desc>

  <g fill="none" stroke="#14304A" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
    <!-- ground line -->
    <line x1="60" y1="520" x2="580" y2="520"/>

    <!-- main roof -->
    <path d="M100 260 L320 120 L540 260"/>
    <line x1="120" y1="260" x2="120" y2="520"/>
    <line x1="520" y1="260" x2="520" y2="520"/>
    <line x1="120" y1="260" x2="520" y2="260"/>

    <!-- chimney -->
    <line x1="440" y1="150" x2="440" y2="205"/>
    <line x1="420" y1="150" x2="460" y2="150"/>

    <!-- center dividing wall (duplex split) -->
    <line x1="320" y1="260" x2="320" y2="520"/>

    <!-- left unit door -->
    <rect x="180" y="410" width="60" height="110"/>
    <line x1="210" y1="410" x2="210" y2="520"/>

    <!-- right unit door -->
    <rect x="400" y="410" width="60" height="110"/>
    <line x1="430" y1="410" x2="430" y2="520"/>

    <!-- left windows -->
    <rect x="150" y="300" width="52" height="64"/>
    <line x1="176" y1="300" x2="176" y2="364"/>
    <line x1="150" y1="332" x2="202" y2="332"/>

    <rect x="260" y="300" width="52" height="64"/>
    <line x1="286" y1="300" x2="286" y2="364"/>
    <line x1="260" y1="332" x2="312" y2="332"/>

    <!-- right windows -->
    <rect x="328" y="300" width="52" height="64"/>
    <line x1="354" y1="300" x2="354" y2="364"/>
    <line x1="328" y1="332" x2="380" y2="332"/>

    <rect x="438" y="300" width="52" height="64"/>
    <line x1="464" y1="300" x2="464" y2="364"/>
    <line x1="438" y1="332" x2="490" y2="332"/>

    <!-- shared entry walk -->
    <path d="M320 520 L320 570"/>
    <path d="M260 570 L380 570"/>

    <!-- ground-level shrub marks, minimal -->
    <path d="M135 520 q10 -22 22 0"/>
    <path d="M505 520 q-10 -22 -22 0"/>
  </g>

  <!-- registration marks, drafting-style accents -->
  <g stroke="#14304A" stroke-width="1.25" fill="none">
    <line x1="60" y1="510" x2="60" y2="530"/>
    <line x1="580" y1="510" x2="580" y2="530"/>
    <line x1="50" y1="520" x2="70" y2="520" opacity="0"/>
  </g>
</svg>
